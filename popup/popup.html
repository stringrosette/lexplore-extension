<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexplore</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Lexplore <span id="version"></span></h1>
    <button id="account-btn" class="icon-btn" title="Account">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="state-loading" class="state">
      <p class="muted">Detecting video metadata…</p>
    </div>

    <div id="state-error" class="state hidden">
      <p class="error-msg"></p>
    </div>

    <div id="state-main" class="state hidden">
      <label for="title-input">Title</label>
      <input type="text" id="title-input" />

      <div class="meta-row">
        <span class="meta-label">Channel</span>
        <span id="author-display" class="meta-value"></span>
        <span class="meta-label">Language</span>
        <span id="lang-display" class="lang-badge"></span>
      </div>

      <button id="load-btn">Load transcript</button>

      <div id="transcript-section" class="hidden">
        <label for="preview">Transcript preview</label>
        <textarea id="preview" readonly rows="6"></textarea>
        <button id="send-btn">Send to Lexplore</button>
      </div>
    </div>

    <div id="state-success" class="state hidden">
      <p class="success-msg">✓ Sent to Lexplore</p>
    </div>

    <div id="state-login" class="state hidden">
      <div id="login-form">
        <p class="form-title">Sign in to Lexplore</p>
        <label for="email-input">Email</label>
        <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email" />
        <label for="password-input">Password</label>
        <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password" />
        <p id="login-error" class="login-error hidden"></p>
        <button id="login-submit-btn">Sign in</button>
        <div class="divider"><span>or</span></div>
        <button id="google-login-btn" class="btn-google">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>
      </div>
      <div id="login-status" class="hidden">
        <p class="form-title">Signed in</p>
        <p id="login-email-display" class="muted"></p>
        <button id="logout-btn" class="btn-secondary">Sign out</button>
      </div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
